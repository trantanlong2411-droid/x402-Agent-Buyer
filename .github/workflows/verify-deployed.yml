name: x402 Agent Buyer — deployed Worker + live quote checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deployed.yml'
      - 'scripts/smoke-deployed.mjs'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-deployed-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify running Worker, real merchant quotes, both budget caps, invalid signature and simulations
        run: node scripts/smoke-deployed.mjs
      - name: Archive verified public Worker evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x402-agent-buyer-deployed-readiness
          path: proof/deployed-agent-readiness.json
          retention-days: 30
          if-no-files-found: error
